[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-embed"
version = "0.1.0"
description = "Instruction-aware speech embeddings with large audio-language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "pillow>=10",
    "transformers==5.8.1",
    "accelerate>=1.13,<2",
    "numpy>=1.26,<3",
    "librosa==0.11.0",
    "soundfile>=0.13,<0.14",
    "safetensors>=0.6",
]

[project.optional-dependencies]
training = [
    "accelerate==1.13.0",
    "peft==0.19.1",
    "trl==0.29.1",
    "datasets==4.8.4",
    "modelscope==1.37.1",
    "deepspeed==0.18.9",
    "qwen-omni-utils==0.0.9",
    "av==17.0.1",
    "torchcodec==0.14.0",
]
experiments = [
    "datasets==4.8.4",
    "torchcodec==0.14.0",
    "tqdm>=4.67,<5",
    "matplotlib>=3.9,<4",
]
maeb = [
    "mteb[audio]==2.18.0",
    "datasets==4.8.4",
    "torchcodec==0.14.0",
    "torchaudio>=2.11,<2.12",
    "scikit-learn==1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["iris*"]
namespaces = true

[tool.ruff]
line-length = 88
target-version = "py312"
